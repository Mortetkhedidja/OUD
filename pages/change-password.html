<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>تغيير كلمة المرور | منصة عُضد</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            min-height: 100vh;

            font-family:
                "Segoe UI",
                Tahoma,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f8f6,
                    #f7fcfb
                );

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

            color: #173b3a;
        }


        .container {

            width: 100%;

            max-width: 500px;

            background: white;

            border-radius: 28px;

            padding: 45px;

            box-shadow:
                0 20px 60px
                rgba(0, 0, 0, 0.12);

            text-align: center;
        }


        .icon {

            width: 85px;

            height: 85px;

            margin: 0 auto 22px;

            border-radius: 25px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #37b7c0
                );

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 38px;

            box-shadow:
                0 10px 25px
                rgba(15,118,110,0.20);
        }


        h1 {

            color: #164e4b;

            font-size: 27px;

            margin-bottom: 10px;
        }


        .description {

            color: #718180;

            font-size: 14px;

            line-height: 1.9;

            margin-bottom: 28px;
        }


        .welcome {

            background: #edf8f6;

            border: 1px solid #d4ece9;

            border-radius: 13px;

            padding: 13px;

            margin-bottom: 22px;

            color: #24635f;

            font-size: 13px;

            line-height: 1.7;
        }


        .input-group {

            text-align: right;

            margin-bottom: 18px;
        }


        label {

            display: block;

            margin-bottom: 8px;

            color: #315452;

            font-size: 14px;

            font-weight: 600;
        }


        .input-wrapper {

            position: relative;
        }


        input {

            width: 100%;

            height: 52px;

            border:
                1.5px solid #d7e7e5;

            border-radius: 13px;

            padding:
                0 45px 0 45px;

            font-family: inherit;

            font-size: 15px;

            outline: none;

            color: #254a48;

            background: #fbfdfd;

            transition: 0.25s;
        }


        input:focus {

            border-color: #1aa397;

            background: white;

            box-shadow:
                0 0 0 4px
                rgba(26,163,151,0.08);
        }


        .input-icon {

            position: absolute;

            right: 15px;

            top: 50%;

            transform: translateY(-50%);

            font-size: 18px;

            color: #7aa5a1;

            pointer-events: none;
        }


        .toggle-password {

            position: absolute;

            left: 14px;

            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            cursor: pointer;

            font-size: 17px;

            color: #78918f;
        }


        .requirements {

            text-align: right;

            background: #fafcfc;

            border: 1px solid #e4eeee;

            border-radius: 13px;

            padding: 13px 16px;

            margin:
                5px 0 20px;

            font-size: 12px;

            color: #718180;

            line-height: 1.9;
        }


        .requirements strong {

            color: #315452;
        }


        .change-button {

            width: 100%;

            height: 53px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #0f766e,
                    #18a398
                );

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s;

            box-shadow:
                0 8px 20px
                rgba(15,118,110,0.20);
        }


        .change-button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px
                rgba(15,118,110,0.28);
        }


        .change-button:disabled {

            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        .alert {

            display: none;

            padding: 13px 15px;

            border-radius: 11px;

            margin-bottom: 18px;

            font-size: 13px;

            line-height: 1.7;
        }


        .alert.error {

            display: block;

            background: #fff1f1;

            color: #b42318;

            border:
                1px solid #ffd5d5;
        }


        .alert.success {

            display: block;

            background: #edfaf5;

            color: #087443;

            border:
                1px solid #c9efdd;
        }


        .loading {

            display: none;

            align-items: center;

            justify-content: center;

            gap: 8px;

            margin-top: 15px;

            color: #0f766e;

            font-size: 13px;
        }


        .spinner {

            width: 17px;

            height: 17px;

            border-radius: 50%;

            border:
                2px solid #cce9e6;

            border-top-color: #0f766e;

            animation:
                spin 0.8s linear infinite;
        }


        @keyframes spin {

            to {
                transform: rotate(360deg);
            }

        }


        @media (max-width: 550px) {

            .container {

                padding: 32px 22px;

            }

        }

    </style>

    <!-- تطبيق منصة عضد (PWA) -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#073B3A">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="عضد">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <script src="/js/pwa.js" defer></script>

</head>


<body>


<div class="container">


    <div class="icon">
        🔐
    </div>


    <h1>
        تغيير كلمة المرور
    </h1>


    <p class="description">

        هذه أول مرة تقوم فيها بتسجيل الدخول
        إلى منصة عُضد.

        <br>

        يرجى إنشاء كلمة مرور جديدة
        لحماية حسابك.

    </p>


    <div
        class="welcome"
        id="userInfo"
    >
        جارٍ تحميل بيانات الحساب...
    </div>


    <div
        id="alert"
        class="alert"
    ></div>


    <!-- كلمة المرور الجديدة -->

    <div class="input-group">

        <label for="newPassword">
            كلمة المرور الجديدة
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="newPassword"
                placeholder="أدخل كلمة المرور الجديدة"
                autocomplete="new-password"
            >

            <button
                type="button"
                class="toggle-password"
                id="toggleNewPassword"
            >
                👁
            </button>

        </div>

    </div>



    <!-- تأكيد كلمة المرور -->

    <div class="input-group">

        <label for="confirmPassword">
            تأكيد كلمة المرور
        </label>

        <div class="input-wrapper">

            <span class="input-icon">
                🔒
            </span>

            <input
                type="password"
                id="confirmPassword"
                placeholder="أعد إدخال كلمة المرور"
                autocomplete="new-password"
            >

            <button
                type="button"
                class="toggle-password"
                id="toggleConfirmPassword"
            >
                👁
            </button>

        </div>

    </div>



    <div class="requirements">

        <strong>
            متطلبات كلمة المرور:
        </strong>

        <br>

        • يجب أن تحتوي على 6 أحرف أو أرقام على الأقل.

        <br>

        • يجب أن تكون كلمتا المرور متطابقتين.

    </div>



    <button
        type="button"
        class="change-button"
        id="changePasswordButton"
    >
        حفظ كلمة المرور
    </button>



    <div
        class="loading"
        id="loading"
    >

        <span class="spinner"></span>

        جارٍ تحديث كلمة المرور...

    </div>


</div>



<script type="module">

    import {
        auth,
        db
    } from "../js/firebase.js";


    import {
        onAuthStateChanged,
        updatePassword,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import {
        doc,
        getDoc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";



    /* =====================================================
       العناصر
    ===================================================== */

    const newPassword =
        document.getElementById(
            "newPassword"
        );


    const confirmPassword =
        document.getElementById(
            "confirmPassword"
        );


    const changePasswordButton =
        document.getElementById(
            "changePasswordButton"
        );


    const loading =
        document.getElementById(
            "loading"
        );


    const alertBox =
        document.getElementById(
            "alert"
        );


    const userInfo =
        document.getElementById(
            "userInfo"
        );



    /* =====================================================
       الرسائل
    ===================================================== */

    function showAlert(
        message,
        type = "error"
    ) {

        alertBox.textContent =
            message;

        alertBox.className =
            "alert " + type;

        alertBox.style.display =
            "block";
    }



    function hideAlert() {

        alertBox.textContent = "";

        alertBox.className =
            "alert";

        alertBox.style.display =
            "none";
    }



    /* =====================================================
       إظهار / إخفاء كلمة المرور
    ===================================================== */

    document
        .getElementById("toggleNewPassword")
        .addEventListener(
            "click",
            () => {

                if (
                    newPassword.type ===
                    "password"
                ) {

                    newPassword.type =
                        "text";

                } else {

                    newPassword.type =
                        "password";
                }

            }
        );



    document
        .getElementById("toggleConfirmPassword")
        .addEventListener(
            "click",
            () => {

                if (
                    confirmPassword.type ===
                    "password"
                ) {

                    confirmPassword.type =
                        "text";

                } else {

                    confirmPassword.type =
                        "password";
                }

            }
        );



    /* =====================================================
       التحقق من المستخدم
    ===================================================== */

    onAuthStateChanged(
        auth,
        async (user) => {

            if (!user) {

                showAlert(
                    "انتهت جلسة تسجيل الدخول. يرجى تسجيل الدخول مرة أخرى."
                );

                changePasswordButton.disabled =
                    true;

                return;
            }



            try {

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                const userSnapshot =
                    await getDoc(
                        userRef
                    );


                if (
                    !userSnapshot.exists()
                ) {

                    await signOut(auth);

                    showAlert(
                        "بيانات حسابك غير موجودة في قاعدة البيانات."
                    );

                    return;
                }


                const userData =
                    userSnapshot.data();



                /* =========================================
                   التأكد من أن الحساب متطوع
                ========================================= */

                if (
                    userData.role !==
                    "volunteer"
                ) {

                    await signOut(auth);

                    showAlert(
                        "هذا الحساب ليس حساب متطوع."
                    );

                    return;
                }



                /* =========================================
                   إذا كان لا يحتاج تغيير كلمة المرور
                ========================================= */

                if (
                    userData.mustChangePassword !==
                    true
                ) {

                    window.location.replace(
                        "./volunter.html"
                    );

                    return;
                }



                /* =========================================
                   عرض بيانات الحساب
                ========================================= */

                userInfo.textContent =
                    "مرحباً " +
                    (
                        userData.fullName ||
                        user.email ||
                        "بك"
                    ) +
                    "، يرجى تعيين كلمة مرور جديدة.";


            }

            catch (error) {

                console.error(
                    "Load user error:",
                    error
                );

                showAlert(
                    "تعذر الوصول إلى بيانات الحساب. رمز الخطأ: " +
                    (
                        error.code ||
                        "غير معروف"
                    )
                );

            }

        }
    );



    /* =====================================================
       تغيير كلمة المرور
    ===================================================== */

    changePasswordButton.addEventListener(
        "click",
        async () => {

            hideAlert();


            const password =
                newPassword.value;


            const confirm =
                confirmPassword.value;



            /* =========================================
               التحقق
            ========================================= */

            if (!password) {

                showAlert(
                    "يرجى إدخال كلمة المرور الجديدة."
                );

                return;
            }


            if (password.length < 6) {

                showAlert(
                    "كلمة المرور يجب أن تحتوي على 6 أحرف أو أرقام على الأقل."
                );

                return;
            }


            if (!confirm) {

                showAlert(
                    "يرجى تأكيد كلمة المرور."
                );

                return;
            }


            if (
                password !==
                confirm
            ) {

                showAlert(
                    "كلمتا المرور غير متطابقتين."
                );

                return;
            }



            const user =
                auth.currentUser;


            if (!user) {

                showAlert(
                    "انتهت جلسة تسجيل الدخول. يرجى تسجيل الدخول مرة أخرى."
                );

                return;
            }



            changePasswordButton.disabled =
                true;

            loading.style.display =
                "flex";



            try {


                /* =========================================
                   1. تغيير كلمة المرور في Firebase Auth
                ========================================= */

                await updatePassword(
                    user,
                    password
                );



                /* =========================================
                   2. تحديث users/{uid}
                ========================================= */

                const userRef =
                    doc(
                        db,
                        "users",
                        user.uid
                    );


                await updateDoc(
                    userRef,
                    {
                        mustChangePassword:
                            false
                    }
                );



                /* =========================================
                   3. تحديث volunteerCards أيضاً
                ========================================= */

                /*
                   لا نقوم بتعديل volunteerCards
                   من هذه الصفحة الآن.

                   users/{uid} هو المصدر الأساسي
                   لحالة تغيير كلمة المرور.
                */



                showAlert(
                    "تم تغيير كلمة المرور بنجاح. سيتم تحويلك إلى حسابك.",
                    "success"
                );


                setTimeout(
                    () => {

                        window.location.replace(
                            "./volunter.html"
                        );

                    },
                    1200
                );

            }


            catch (error) {

                console.error(
                    "Change password error:",
                    error
                );


                let message;


                switch (
                    error.code
                ) {

                    case "auth/requires-recent-login":

                        message =
                            "يرجى تسجيل الخروج ثم تسجيل الدخول مرة أخرى قبل تغيير كلمة المرور.";

                        break;


                    case "auth/weak-password":

                        message =
                            "كلمة المرور ضعيفة. استخدمي كلمة مرور أقوى.";

                        break;


                    case "auth/network-request-failed":

                        message =
                            "تعذر الاتصال بخدمة Firebase.";

                        break;


                    case "permission-denied":

                        message =
                            "ليس لديك صلاحية لتحديث بيانات الحساب في Firebase.";

                        break;


                    default:

                        message =
                            "تعذر تغيير كلمة المرور. رمز الخطأ: " +
                            (
                                error.code ||
                                "غير معروف"
                            );

                }


                showAlert(
                    message
                );

            }


            finally {

                changePasswordButton.disabled =
                    false;

                loading.style.display =
                    "none";

            }

        }
    );

</script>


</body>

</html>
