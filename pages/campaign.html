/* =====================================
   التاريخ
===================================== */

function getToday() {

    const now = new Date();

    const year =
        now.getFullYear();

    const month =
        String(
            now.getMonth() + 1
        ).padStart(2, "0");

    const day =
        String(
            now.getDate()
        ).padStart(2, "0");

    return `${year}-${month}-${day}`;

}



/* =====================================
   تحويل الوقت إلى دقائق
===================================== */

function timeToMinutes(time) {

    const parts =
        time.split(":");

    const hours =
        parseInt(parts[0]);

    const minutes =
        parseInt(parts[1]);

    return (
        hours * 60 +
        minutes
    );

}



/* =====================================
   فحص تعارض المواعيد
   للمتطوع صاحب الحساب
===================================== */

async function hasTimeConflict(
    userId,
    newCampaign
) {

    const registrationsQuery =
        query(
            collection(
                db,
                "registrations"
            ),

            where(
                "userId",
                "==",
                userId
            )
        );


    const snapshot =
        await getDocs(
            registrationsQuery
        );


    const newStart =
        timeToMinutes(
            newCampaign.startTime
        );


    const newEnd =
        timeToMinutes(
            newCampaign.endTime
        );


    for (
        const registration
        of snapshot.docs
    ) {

        const data =
            registration.data();


        if (
            data.status ===
            "cancelled"
        ) {
            continue;
        }


        if (
            !data.campaignId
        ) {
            continue;
        }


        const oldCampaignSnapshot =
            await getDoc(
                doc(
                    db,
                    "campaigns",
                    data.campaignId
                )
            );


        if (
            !oldCampaignSnapshot.exists()
        ) {
            continue;
        }


        const oldCampaign =
            oldCampaignSnapshot.data();


        if (
            oldCampaign.date !==
            newCampaign.date
        ) {
            continue;
        }


        const oldStart =
            timeToMinutes(
                oldCampaign.startTime
            );


        const oldEnd =
            timeToMinutes(
                oldCampaign.endTime
            );


        if (
            newStart < oldEnd &&
            newEnd > oldStart
        ) {

            return oldCampaign;

        }

    }


    return null;

}

/* =====================================
   تسجيل الزائر
===================================== */

async function registerAsGuest(event) {

    event.preventDefault();


    const submitButton =
        document.getElementById(
            "guestSubmit"
        );


    const message =
        document.getElementById(
            "guestMessage"
        );


    const fullName =
        document
            .getElementById(
                "guestFullName"
            )
            .value
            .trim();


    const phone =
        document
            .getElementById(
                "guestPhone"
            )
            .value
            .trim();


    const email =
        document
            .getElementById(
                "guestEmail"
            )
            .value
            .trim();


    const category =
        document
            .getElementById(
                "guestCategory"
            )
            .value;


    const birthDate =
        document
            .getElementById(
                "guestBirthDate"
            )
            .value;


    if (
        !fullName ||
        !phone ||
        !email ||
        !category
    ) {

        message.style.display =
            "block";

        message.className =
            "message warning";

        message.textContent =
            "يرجى ملء جميع الحقول المطلوبة.";

        return;

    }


    submitButton.disabled =
        true;

    submitButton.textContent =
        "جاري التسجيل...";


    try {

        /*
         * نستخدم رقم الهاتف مع رقم الحملة
         * لإنشاء معرف ثابت للتسجيل.
         *
         * إذا حاول نفس الزائر التسجيل
         * مرة ثانية بنفس الرقم في نفس الحملة،
         * لن يتم إنشاء تسجيل جديد.
         */

        const normalizedPhone =
            phone.replace(
                /[^0-9+]/g,
                ""
            );


        const registrationId =
            `guest_${campaignId}_${normalizedPhone}`;


        const registrationRef =
            doc(
                db,
                "registrations",
                registrationId
            );
            

        /*
         * التسجيل كزائر:
         *
         * لا يوجد userId
         * لا يوجد حساب
         * لا توجد بطاقة
         */

        await setDoc(
            registrationRef,
            {

                registrationType:
                    "guest",

                userId:
                    null,

                campaignId:
                    campaignId,

                fullName:
                    fullName,

                phone:
                    normalizedPhone,

                email:
                    email,

                category:
                    category,

                birthDate:
                    birthDate || null,

                registeredAt:
                    serverTimestamp(),

                status:
                    "registered",

                attendance:
                    "pending"

            }
        );


        message.style.display =
            "block";

        message.className =
            "message success";


        message.innerHTML = `

            <strong>
                ✓ تم تسجيلك في الحملة بنجاح.
            </strong>

            <br><br>

            سيتم التواصل معك عبر رقم الهاتف
            أو البريد الإلكتروني بالمعلومات
            المتعلقة بالحملة.

            <br><br>

            <strong>
                ${currentCampaign.title}
            </strong>

            <br>

            التاريخ:
            ${currentCampaign.date}

            <br>

            الوقت:
            ${currentCampaign.startTime}
            -
            ${currentCampaign.endTime}

            <br>

            المكان:
            ${currentCampaign.location}

            <br><br>

            <strong>
                ملاحظة:
            </strong>

            التسجيل لا يعني احتساب المشاركة.
            تحتسب المشاركة فقط بعد تأكيد حضورك
            من الإدارة.

        `;


        submitButton.style.display =
            "none";


    } catch (error) {

        console.error(
            "Guest registration error:",
            error
        );


        message.style.display =
            "block";

        message.className =
            "message warning";


        if (
            error.code ===
            "permission-denied"
        ) {

            message.textContent =
                "لا يمكن إتمام التسجيل حاليًا. يرجى التأكد من إعدادات النظام.";

        } else {

            message.textContent =
                "حدث خطأ أثناء التسجيل. حاول مرة أخرى.";

        }


        submitButton.disabled =
            false;

        submitButton.textContent =
            "تأكيد التسجيل";

    }

}

/* =====================================
   دخول صاحب البطاقة ثم التسجيل
===================================== */

async function loginAndRegister() {

    const cardNumber =
        document
            .getElementById(
                "cardNumber"
            )
            .value
            .trim()
            .toUpperCase();


    const email =
        document
            .getElementById(
                "volunteerEmail"
            )
            .value
            .trim();


    const password =
        document
            .getElementById(
                "volunteerPassword"
            )
            .value;


    const button =
        document
            .getElementById(
                "volunteerLoginButton"
            );


    const message =
        document
            .getElementById(
                "volunteerMessage"
            );


    if (
        !cardNumber ||
        !email ||
        !password
    ) {

        message.style.display =
            "block";

        message.className =
            "message warning";

        message.textContent =
            "يرجى إدخال رقم البطاقة والبريد الإلكتروني وكلمة المرور.";

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "جاري التحقق...";


    try {

        /*
         * أولًا: تسجيل الدخول إلى Firebase Auth
         */

        const credential =
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );


        const user =
            credential.user;


        /*
         * ثانيًا: التأكد من أن الحساب
         * يملك بطاقة بهذا الرقم
         */

        const cardsQuery =
            query(
                collection(
                    db,
                    "volunteerCards"
                ),

                where(
                    "userId",
                    "==",
                    user.uid
                ),

                where(
                    "cardNumber",
                    "==",
                    cardNumber
                )
            );


        const cardsSnapshot =
            await getDocs(
                cardsQuery
            );


        if (
            cardsSnapshot.empty
        ) {

            message.style.display =
                "block";

            message.className =
                "message warning";

            message.textContent =
                "رقم البطاقة لا يتطابق مع هذا الحساب.";

            button.disabled =
                false;

            button.textContent =
                "الدخول والتسجيل";

            return;

        }


        /*
         * ثالثًا: التأكد أن البطاقة نشطة
         */

        const card =
            cardsSnapshot
                .docs[0]
                .data();


        if (
            card.status !== "active"
        ) {

            message.style.display =
                "block";

            message.className =
                "message warning";

            message.textContent =
                "هذه البطاقة غير نشطة حاليًا.";

            button.disabled =
                false;

            button.textContent =
                "الدخول والتسجيل";

            return;

        }


        /*
         * رابعًا: منع التسجيل المكرر
         */

        const duplicateQuery =
            query(
                collection(
                    db,
                    "registrations"
                ),

                where(
                    "userId",
                    "==",
                    user.uid
                ),

                where(
                    "campaignId",
                    "==",
                    campaignId
                )
            );


        const duplicateSnapshot =
            await getDocs(
                duplicateQuery
            );


        if (
            !duplicateSnapshot.empty
        ) {

            message.style.display =
                "block";

            message.className =
                "message warning";

            message.textContent =
                "أنت مسجل بالفعل في هذه الحملة.";

            button.disabled =
                true;

            button.textContent =
                "مسجل بالفعل";

            return;

        }


        /*
         * خامسًا: فحص تعارض المواعيد
         */

        const conflict =
            await hasTimeConflict(
                user.uid,
                currentCampaign
            );


        if (conflict) {

            message.style.display =
                "block";

            message.className =
                "message warning";

            message.innerHTML = `

                لا يمكن التسجيل في هذه الحملة
                لأن موعدها يتعارض مع حملة:

                <strong>
                    ${conflict.title}
                </strong>

                <br>

                في نفس اليوم.

            `;


            button.disabled =
                false;

            button.textContent =
                "الدخول والتسجيل";

            return;

        }


        /*
         * سادسًا: إنشاء التسجيل
         */

        await addDoc(
            collection(
                db,
                "registrations"
            ),
            {

                registrationType:
                    "volunteer",

                userId:
                    user.uid,

                campaignId:
                    campaignId,

                fullName:
                    user.email,

                registeredAt:
                    serverTimestamp(),

                status:
                    "registered",

                attendance:
                    "pending"

            }
        );


        /*
         * نجاح
         */

        message.style.display =
            "block";

        message.className =
            "message success";


        message.innerHTML = `

            <strong>
                ✓ تم تسجيلك في الحملة بنجاح.
            </strong>

            <br><br>

            أنت مسجل الآن كمتطوع صاحب بطاقة.

            <br><br>

            <strong>
                ملاحظة:
            </strong>

            التسجيل لا يعني احتساب المشاركة.
            تحتسب المشاركة فقط بعد تأكيد حضورك
            من الإدارة.

        `;


        button.style.display =
            "none";


    } catch (error) {

        console.error(
            "Volunteer registration error:",
            error
        );


        message.style.display =
            "block";

        message.className =
            "message warning";


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            message.textContent =
                "البريد الإلكتروني أو كلمة المرور غير صحيحة.";

        } else {

            message.textContent =
                "تعذر الدخول أو التسجيل. تأكد من بياناتك وحاول مرة أخرى.";

        }


        button.disabled =
            false;

        button.textContent =
            "الدخول والتسجيل";

    }

}



/* =====================================
   تحميل الحملة
===================================== */

async function loadCampaign() {

    if (!campaignId) {

        container.innerHTML = `

            <h2>
                الحملة غير موجودة
            </h2>

        `;

        return;

    }


    try {

        const campaignRef =
            doc(
                db,
                "campaigns",
                campaignId
            );


        const snapshot =
            await getDoc(
                campaignRef
            );


        if (
            !snapshot.exists()
        ) {

            container.innerHTML = `

                <h2>
                    الحملة غير موجودة
                </h2>

            `;

            return;

        }


        currentCampaign =
            snapshot.data();


        const campaign =
            currentCampaign;


        const today =
            getToday();


        container.innerHTML = `

            <h1>
                ${campaign.title}
            </h1>


            <div class="info">

                <strong>
                    المجال:
                </strong>

                ${campaign.field || "غير محدد"}

            </div>


            <div class="section">

                <h2>
                    عن الحملة
                </h2>

                <p>
                    ${campaign.description || ""}
                </p>

            </div>


            <div class="section">

                <h2>
                    معلومات الحملة
                </h2>


                <div class="info">

                    <strong>
                        التاريخ:
                    </strong>

                    ${campaign.date}

                </div>


                <div class="info">

                    <strong>
                        الوقت:
                    </strong>

                    ${campaign.startTime}
                    -
                    ${campaign.endTime}

                </div>


                <div class="info">

                    <strong>
                        المكان:
                    </strong>

                    ${campaign.location}

                </div>


                <div class="info">

                    <strong>
                        السعة:
                    </strong>

                    ${campaign.capacity}
                    مشارك

                </div>


                <div class="info">

                    <strong>
                        آخر موعد للتسجيل:
                    </strong>

                    ${campaign.registrationDeadline || "غير محدد"}

                </div>

            </div>


            <div class="section">

                <h2>
                    الأهداف
                </h2>

                <p>
                    ${
                        campaign.objectives ||
                        "سيتم تحديد الأهداف."
                    }
                </p>

            </div>


            <div class="section">

                <h2>
                    المهام
                </h2>

                <p>
                    ${
                        campaign.tasks ||
                        "سيتم تحديد المهام."
                    }
                </p>

            </div>


            <div class="section">

                <button
                    id="registerButton"
                    class="register-button"
                >
                    التسجيل في الحملة
                </button>


                <div
                    id="message"
                    class="message"
                ></div>


                <div
                    id="registrationBox"
                    class="registration-box"
                    style="display:none;"
                ></div>

            </div>

        `;


        const registerButton =
            document.getElementById(
                "registerButton"
            );


        const message =
            document.getElementById(
                "message"
            );


        const registrationBox =
            document.getElementById(
                "registrationBox"
            );


        /*
         * الحملة انتهت
         */

        if (
            campaign.date <= today
        ) {

            registerButton.disabled =
                true;

            registerButton.textContent =
                "التسجيل مغلق";

            message.textContent =
                "انتهى أجل التسجيل لأن موعد الحملة قد حان.";

            return;

        }


        /*
         * انتهى أجل التسجيل
         */

        if (
            campaign.registrationDeadline &&
            today >
            campaign.registrationDeadline
        ) {

            registerButton.disabled =
                true;

            registerButton.textContent =
                "التسجيل مغلق";

            message.textContent =
                "انتهى آخر أجل للتسجيل في هذه الحملة.";

            return;

        }


        /*
         * فتح خيارات التسجيل
         */

        registerButton.addEventListener(
            "click",
            function() {

                registerButton.style.display =
                    "none";

                message.innerHTML =
                    "";

                registrationBox.style.display =
                    "block";

                showRegistrationChoices();

            }
        );


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <h2 class="error">
                حدث خطأ أثناء تحميل الحملة.
            </h2>

        `;

    }

}


loadCampaign();

</script>
