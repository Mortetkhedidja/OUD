
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | منصة عُضد</title>

    <style>
        :root {
            --green-dark: #082f2b;
            --green: #164f49;
            --green-light: #28685f;
            --green-pale: #edf5f3;
            --gold: #b99b5d;
            --text: #123b38;
            --muted: #84918f;
            --border: #e0e6e4;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: var(--text);
            background:
                radial-gradient(
                    ellipse at 0% 100%,
                    rgba(189, 157, 91, 0.95) 0%,
                    rgba(119, 113, 66, 0.42) 17%,
                    transparent 38%
                ),
                radial-gradient(
                    ellipse at 100% 0%,
                    rgba(38, 103, 93, 0.72) 0%,
                    transparent 45%
                ),
                linear-gradient(
                    120deg,
                    #082f2b,
                    #062b27 55%,
                    #103c36
                );
            background-attachment: fixed;
        }

        button,
        input {
            font: inherit;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }

        .login-container {
            width: 100%;
            max-width: 458px;
            min-height: 760px;
            background: #f5f7f6;
            border-radius: 0 0 30px 30px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.24),
                0 0 0 1px rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            padding: 17px 34px 25px;
        }

        /* الزخرفة العلوية */

        .login-container::before {
            content: "";
            position: absolute;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            background: rgba(190, 166, 109, 0.12);
            top: -110px;
            right: -25px;
            pointer-events: none;
        }

        .login-container::after {
            content: "";
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: rgba(35, 101, 91, 0.045);
            bottom: -85px;
            left: -75px;
            pointer-events: none;
        }

        .login-content {
            width: 100%;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* الأيقونة */

        .logo {
            width: 85px;
            height: 85px;
            margin: 0 auto 23px;
            border-radius: 24px;
            background: linear-gradient(
                145deg,
                #123f39,
                #286b60
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 37px;
            box-shadow: 0 13px 25px rgba(12, 62, 54, 0.18);
            flex-shrink: 0;
        }

        /* العنوان والوصف */

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h1 {
            font-size: 27px;
            font-weight: 750;
            line-height: 1.5;
            color: #103b37;
            margin-bottom: 7px;
        }

        .form-header p {
            color: #81908e;
            font-size: 14px;
            line-height: 2;
        }

        /* اختيار نوع الحساب */

        .section-label {
            display: block;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: #173e3a;
            margin-bottom: 12px;
        }

        .login-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .login-tab {
            min-height: 94px;
            padding: 13px 8px;
            border: 2px solid var(--border);
            border-radius: 16px;
            background: #ffffff;
            color: #183f3a;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease,
                transform 0.2s ease;
        }

        .login-tab:hover {
            border-color: #9ebdb7;
            transform: translateY(-1px);
        }

        .login-tab.active {
            border-color: #154941;
            background: #edf5f3;
            box-shadow: 0 5px 13px rgba(17, 65, 57, 0.08);
        }

        .tab-icon {
            font-size: 25px;
            line-height: 1.2;
        }

        .tab-text {
            font-size: 13px;
            font-weight: 650;
        }

        /* النماذج */

        .login-form {
            display: none;
        }

        .login-form.active {
            display: block;
            animation: appear 0.2s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(4px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            margin-bottom: 19px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: #183f3a;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 17px;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            height: 50px;
            padding: 0 43px;
            border: 2px solid #e1e7e5;
            border-radius: 14px;
            outline: none;
            background: #ffffff;
            color: #244943;
            font-size: 14px;
            transition: 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #a2aaa8;
            opacity: 1;
        }

        .input-wrapper input:focus {
            border-color: #28685f;
            box-shadow: 0 0 0 3px rgba(40, 104, 95, 0.08);
        }

        .password-toggle {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #718682;
            font-size: 17px;
            padding: 4px;
        }

        /* زر تسجيل الدخول */

        .login-button {
            width: 100%;
            min-height: 50px;
            margin-top: 6px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(
                110deg,
                #123f39,
                #28675e
            );
            color: white;
            font-size: 15px;
            font-weight: 750;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .login-button:hover {
            background: linear-gradient(
                110deg,
                #0c342f,
                #205a51
            );
            box-shadow: 0 7px 16px rgba(16, 67, 58, 0.14);
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* الرسائل */

        .alert {
            display: none;
            padding: 12px 14px;
            border-radius: 12px;
            margin-bottom: 17px;
            font-size: 13px;
            line-height: 1.8;
            text-align: center;
            white-space: pre-line;
        }

        .alert.error {
            display: none;
            background: #fff0f0;
            color: #a52828;
            border: 1px solid #f5d0d0;
        }

        .alert.success {
            display: none;
            background: #eaf8f0;
            color: #187044;
            border: 1px solid #c9ead7;
        }

        /* مؤشر التحميل */

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 9px;
            margin-top: 14px;
            color: #28685f;
            font-size: 13px;
        }

        .spinner {
            width: 17px;
            height: 17px;
            border: 2px solid #cce2dd;
            border-top-color: #28685f;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* النص السفلي */

        .bottom-section {
            margin-top: auto;
            padding-top: 30px;
        }

        .help-text {
            text-align: center;
            color: #82908e;
            font-size: 11.5px;
            line-height: 2;
            margin-bottom: 23px;
        }

        .back-link {
            display: block;
            text-align: center;
            text-decoration: none;
            color: #153f39;
            font-size: 14px;
            font-weight: 700;
            padding: 5px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #398579;
        }

        /* الشاشات الصغيرة */

        @media (max-width: 520px) {
            body {
                padding: 0;
                align-items: stretch;
            }

            .login-container {
                max-width: none;
                min-height: 100vh;
                min-height: 100dvh;
                border-radius: 0;
                padding: 22px 24px 25px;
            }

            .logo {
                width: 76px;
                height: 76px;
                font-size: 33px;
                margin-bottom: 19px;
            }

            .form-header {
                margin-bottom: 24px;
            }

            .form-header h1 {
                font-size: 25px;
            }

            .login-tab {
                min-height: 86px;
            }

            .bottom-section {
                padding-top: 25px;
            }
        }

        @media (max-height: 760px) and (min-width: 521px) {
            .login-container {
                min-height: auto;
                padding-top: 15px;
                padding-bottom: 20px;
            }

            .logo {
                width: 70px;
                height: 70px;
                font-size: 31px;
                margin-bottom: 12px;
            }

            .form-header {
                margin-bottom: 18px;
            }

            .form-header h1 {
                font-size: 24px;
            }

            .login-tab {
                min-height: 78px;
            }

            .login-tabs {
                margin-bottom: 18px;
            }

            .input-group {
                margin-bottom: 14px;
            }

            .bottom-section {
                padding-top: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="login-container">
        <div class="login-content">

            <!-- الأيقونة -->
            <div class="logo" id="mainLogo" aria-hidden="true">
                🪪
            </div>

            <!-- العنوان -->
            <header class="form-header">
                <h1 id="pageTitle">دخول المتطوع</h1>

                <p id="pageDescription">
                    استخدم بطاقة عُضد الخاصة بك للوصول إلى مساحتك الشخصية ومتابعة مشاركاتك التطوعية.
                </p>
            </header>

            <!-- اختيار نوع الدخول -->
            <label class="section-label">اختر نوع الدخول</label>

            <div class="login-tabs" role="group" aria-label="نوع الحساب">

                <button
                    type="button"
                    class="login-tab active"
                    id="volunteerTab"
                    aria-pressed="true"
                >
                    <span class="tab-icon">👤</span>
                    <span class="tab-text">المتطوع</span>
                </button>

                <button
                    type="button"
                    class="login-tab"
                    id="adminTab"
                    aria-pressed="false"
                >
                    <span class="tab-icon">🔐</span>
                    <span class="tab-text">لجنة المتابعة</span>
                </button>

            </div>

            <!-- رسائل النظام -->
            <div
                id="alert"
                class="alert"
                role="alert"
                aria-live="polite"
            ></div>

            <!-- ==============================
                 دخول المتطوع
            =============================== -->
            <form id="volunteerForm" class="login-form active">

                <div class="input-group">
                    <label for="cardNumber">رقم بطاقة عُضد</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🪪</span>

                        <input
                            type="text"
                            id="cardNumber"
                            placeholder="مثال: OUD-2026-0001"
                            autocomplete="username"
                            autocapitalize="characters"
                            spellcheck="false"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="volunteerPassword">كلمة المرور</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🔒</span>

                        <input
                            type="password"
                            id="volunteerPassword"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="volunteerPasswordToggle"
                            aria-label="إظهار كلمة المرور"
                            aria-pressed="false"
                        >👁</button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="volunteerLoginButton"
                >
                    دخول المتطوع
                </button>

                <div class="loading" id="volunteerLoading">
                    <span class="spinner"></span>
                    جارٍ التحقق من بياناتك...
                </div>

            </form>

            <!-- ==============================
                 دخول لجنة المتابعة والإدارة
            =============================== -->
            <form id="adminForm" class="login-form">

                <div class="input-group">
                    <label for="adminEmail">البريد الإلكتروني</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">✉️</span>

                        <input
                            type="email"
                            id="adminEmail"
                            placeholder="أدخل البريد الإلكتروني"
                            autocomplete="username"
                            dir="ltr"
                            required
                        >
                    </div>
                </div>

                <div class="input-group">
                    <label for="adminPassword">كلمة المرور</label>

                    <div class="input-wrapper">
                        <span class="input-icon" aria-hidden="true">🔒</span>

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="أدخل كلمة المرور"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="adminPasswordToggle"
                            aria-label="إظهار كلمة المرور"
                            aria-pressed="false"
                        >👁</button>
                    </div>
                </div>

                <button
                    type="submit"
                    class="login-button"
                    id="adminLoginButton"
                >
                    دخول لجنة المتابعة
                </button>

                <div class="loading" id="adminLoading">
                    <span class="spinner"></span>
                    جارٍ التحقق من صلاحيات الحساب...
                </div>

            </form>

            <!-- النص السفلي والرابط -->
            <footer class="bottom-section">

                <p class="help-text" id="helpText">
                    🔒 بياناتك محمية، ويتم التحقق من بطاقة المتطوع قبل تسجيل الدخول.
                </p>

                <a href="../index.html" class="back-link">
                    ← العودة إلى منصة عُضد
                </a>

            </footer>

        </div>
    </main>

    <!-- Firebase -->
    <script type="module">
        import {
            auth,
            db
        } from "../js/firebase.js";

        import {
            signInWithEmailAndPassword,
            signOut
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        import {
            collection,
            query,
            where,
            getDocs,
            doc,
            getDoc
        } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


        /* =========================================
           عناصر الصفحة
        ========================================= */

        const volunteerTab = document.getElementById("volunteerTab");
        const adminTab = document.getElementById("adminTab");

        const volunteerForm = document.getElementById("volunteerForm");
        const adminForm = document.getElementById("adminForm");

        const alertBox = document.getElementById("alert");

        const pageTitle = document.getElementById("pageTitle");
        const pageDescription = document.getElementById("pageDescription");
        const mainLogo = document.getElementById("mainLogo");
        const helpText = document.getElementById("helpText");

        const volunteerPassword =
            document.getElementById("volunteerPassword");

        const adminPassword =
            document.getElementById("adminPassword");

        const volunteerLoginButton =
            document.getElementById("volunteerLoginButton");

        const adminLoginButton =
            document.getElementById("adminLoginButton");

        const volunteerLoading =
            document.getElementById("volunteerLoading");

        const adminLoading =
            document.getElementById("adminLoading");


        /* =========================================
           رسائل الخطأ
        ========================================= */

        function showAlert(message, type = "error") {
            alertBox.textContent = message;
            alertBox.className = "alert " + type;
            alertBox.style.display = "block";
        }

        function hideAlert() {
            alertBox.style.display = "none";
            alertBox.textContent = "";
            alertBox.className = "alert";
        }

        function getFirebaseErrorMessage(error) {
            console.error("Firebase Error:", error);

            const code = error?.code || "";

            switch (code) {
                case "auth/invalid-api-key":
                    return "مفتاح Firebase غير صالح. تحققي من ملف js/firebase.js.";

                case "auth/invalid-credential":
                    return "بيانات الدخول غير صحيحة. تحققي من المعلومات وحاولي مجددًا.";

                case "auth/wrong-password":
                    return "كلمة المرور غير صحيحة.";

                case "auth/user-not-found":
                    return "لا يوجد حساب مرتبط ببيانات الدخول هذه.";

                case "auth/user-disabled":
                    return "هذا الحساب معطل. يرجى التواصل مع الإدارة.";

                case "auth/too-many-requests":
                    return "تم إجراء محاولات كثيرة. يرجى الانتظار قليلًا ثم المحاولة مجددًا.";

                case "auth/network-request-failed":
                    return "تعذر الاتصال بخدمة Firebase. تحققي من اتصال الإنترنت.";

                case "permission-denied":
                case "firestore/permission-denied":
                    return "لا تتوفر صلاحية قراءة البيانات. تحققي من قواعد أمان Firestore.";

                case "failed-precondition":
                    return "تعذر تنفيذ العملية بسبب إعداد في Firebase.";

                case "unavailable":
                    return "خدمة Firebase غير متاحة حاليًا. حاولي مجددًا.";

                default:
                    return "حدث خطأ أثناء تسجيل الدخول. " +
                        "رمز الخطأ: " + (code || "غير معروف");
            }
        }


        /* =========================================
           تبديل نوع الدخول وتحديث التصميم
        ========================================= */

        function setLoginMode(mode) {
            const isVolunteer = mode === "volunteer";

            volunteerTab.classList.toggle("active", isVolunteer);
            adminTab.classList.toggle("active", !isVolunteer);

            volunteerTab.setAttribute(
                "aria-pressed",
                String(isVolunteer)
            );

            adminTab.setAttribute(
                "aria-pressed",
                String(!isVolunteer)
            );

            volunteerForm.classList.toggle("active", isVolunteer);
            adminForm.classList.toggle("active", !isVolunteer);

            if (isVolunteer) {
                mainLogo.textContent = "🪪";
                pageTitle.textContent = "دخول المتطوع";

                pageDescription.textContent =
                    "استخدم بطاقة عُضد الخاصة بك للوصول إلى مساحتك الشخصية ومتابعة مشاركاتك التطوعية.";

                helpText.textContent =
                    "🔒 بياناتك محمية، ويتم التحقق من بطاقة المتطوع قبل تسجيل الدخول.";

                volunteerLoginButton.textContent = "دخول المتطوع";
            } else {
                mainLogo.textContent = "🔐";
                pageTitle.textContent = "دخول لجنة المتابعة";

                pageDescription.textContent =
                    "دخول مخصص لأعضاء لجنة المتابعة لإدارة الحملات والتسجيلات والمشاركات وبطاقات المتطوعين.";

                helpText.textContent =
                    "🔒 الدخول الإداري محمي، ويتم التحقق من صلاحية الحساب قبل فتح لوحة المتابعة.";

                adminLoginButton.textContent = "دخول لجنة المتابعة";
            }

            hideAlert();
        }

        volunteerTab.addEventListener("click", () => {
            setLoginMode("volunteer");
        });

        adminTab.addEventListener("click", () => {
            setLoginMode("admin");
        });


        /* =========================================
           إظهار وإخفاء كلمة المرور
        ========================================= */

        function setupPasswordToggle(input, button) {
            button.addEventListener("click", () => {
                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";
                button.textContent = isHidden ? "🙈" : "👁";

                button.setAttribute(
                    "aria-pressed",
                    String(isHidden)
                );

                button.setAttribute(
                    "aria-label",
                    isHidden
                        ? "إخفاء كلمة المرور"
                        : "إظهار كلمة المرور"
                );
            });
        }

        setupPasswordToggle(
            volunteerPassword,
            document.getElementById("volunteerPasswordToggle")
        );

        setupPasswordToggle(
            adminPassword,
            document.getElementById("adminPasswordToggle")
        );


        /* =========================================
           تسجيل دخول المتطوع
        ========================================= */

        volunteerForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideAlert();

            const cardNumber = document
                .getElementById("cardNumber")
                .value
                .trim()
                .toUpperCase();

            const password = volunteerPassword.value;

            if (!cardNumber) {
                showAlert("يرجى إدخال رقم بطاقة عُضد.");
                return;
            }

            if (!password) {
                showAlert("يرجى إدخال كلمة المرور.");
                return;
            }

            volunteerLoginButton.disabled = true;
            volunteerLoading.style.display = "flex";

            try {
                /* 1. البحث عن البطاقة النشطة */

                const cardQuery = query(
                    collection(db, "volunteerCards"),
                    where("cardNumber", "==", cardNumber),
                    where("status", "==", "active")
                );

                const cardSnapshot = await getDocs(cardQuery);

                if (cardSnapshot.empty) {
                    throw new Error("CARD_NOT_FOUND");
                }

                const cardDoc = cardSnapshot.docs[0];
                const card = cardDoc.data();

                /* 2. التحقق من حالة البطاقة */

                if (card.status !== "active") {
                    throw new Error("CARD_NOT_ACTIVE");
                }

                /* 3. التحقق من البريد الإلكتروني المرتبط */

                if (!card.email) {
                    throw new Error("CARD_EMAIL_MISSING");
                }

                /* 4. تسجيل الدخول إلى Firebase Authentication */

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        card.email,
                        password
                    );

                const user = userCredential.user;

                /* 5. التحقق من هوية المستخدم */

                if (card.userId && user.uid !== card.userId) {
                    await signOut(auth);
                    throw new Error("USER_ID_MISMATCH");
                }

                /* 6. قراءة بيانات المستخدم */

                const userRef = doc(db, "users", user.uid);
                const userSnapshot = await getDoc(userRef);

                if (!userSnapshot.exists()) {
                    await signOut(auth);
                    throw new Error("USER_DATA_NOT_FOUND");
                }

                const userData = userSnapshot.data();

                /* 7. التأكد من أن الحساب لمتطوع */

                if (userData.role !== "volunteer") {
                    await signOut(auth);
                    throw new Error("NOT_VOLUNTEER");
                }

                /* 8. التحقق من رقم البطاقة */

                if (
                    userData.cardNumber &&
                    userData.cardNumber !== cardNumber
                ) {
                    await signOut(auth);
                    throw new Error("USER_CARD_MISMATCH");
                }

                /* 9. توجيه المستخدم لتغيير كلمة المرور عند الحاجة */

                if (userData.mustChangePassword === true) {
                    window.location.replace("./change-password.html");
                    return;
                }

                /* 10. فتح مساحة المتطوع */

                window.location.replace("./volunter.html");

            } catch (error) {
                console.error("Volunteer login error:", error);

                let message;

                switch (error.message) {
                    case "CARD_NOT_FOUND":
                        message =
                            "رقم بطاقة عُضد غير موجود أو أن البطاقة غير نشطة. تحققي من الرقم وحاولي مجددًا.";
                        break;

                    case "CARD_NOT_ACTIVE":
                        message =
                            "هذه البطاقة غير نشطة، ولا يمكن استخدامها لتسجيل الدخول.";
                        break;

                    case "CARD_EMAIL_MISSING":
                        message =
                            "لا يوجد بريد إلكتروني مرتبط بهذه البطاقة. يرجى التواصل مع الإدارة.";
                        break;

                    case "USER_ID_MISMATCH":
                        message =
                            "يوجد اختلاف بين البطاقة وحساب Firebase المرتبط بها.";
                        break;

                    case "USER_DATA_NOT_FOUND":
                        message =
                            "بيانات حساب المتطوع غير موجودة في قاعدة البيانات.";
                        break;

                    case "NOT_VOLUNTEER":
                        message = "هذا الحساب ليس حساب متطوع.";
                        break;

                    case "USER_CARD_MISMATCH":
                        message =
                            "رقم البطاقة المرتبط بالحساب لا يطابق البطاقة المستخدمة.";
                        break;

                    default:
                        message = getFirebaseErrorMessage(error);
                }

                showAlert(message);

            } finally {
                volunteerLoginButton.disabled = false;
                volunteerLoading.style.display = "none";
            }
        });


        /* =========================================
           تسجيل دخول لجنة المتابعة / الإدارة
        ========================================= */

        adminForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            hideAlert();

            const email = document
                .getElementById("adminEmail")
                .value
                .trim();

            const password = adminPassword.value;

            if (!email) {
                showAlert("يرجى إدخال البريد الإلكتروني.");
                return;
            }

            if (!password) {
                showAlert("يرجى إدخال كلمة المرور.");
                return;
            }

            adminLoginButton.disabled = true;
            adminLoading.style.display = "flex";

            try {
                /* 1. تسجيل الدخول */

                const userCredential =
                    await signInWithEmailAndPassword(
                        auth,
                        email,
                        password
                    );

                const user = userCredential.user;

                /* 2. قراءة بيانات الحساب */

                const userRef = doc(db, "users", user.uid);
                const userSnapshot = await getDoc(userRef);

                if (!userSnapshot.exists()) {
                    await signOut(auth);
                    throw new Error("ADMIN_DATA_NOT_FOUND");
                }

                const userData = userSnapshot.data();

                /* 3. التحقق من الصلاحية */

                if (userData.role !== "admin") {
                    await signOut(auth);
                    throw new Error("NOT_ADMIN");
                }

                /* 4. فتح لوحة الإدارة */
                showAlert("تم تسجيل الدخول بنجاح. جارٍ فتح لوحة الإدارة...", "success");

setTimeout(() => {
    window.location.href = new URL("./admin.html", window.location.href).href;
}, 500);

            } catch (error) {
                console.error("Admin login error:", error);

                let message;

                if (error.message === "ADMIN_DATA_NOT_FOUND") {
                    message =
                        "بيانات حساب لجنة المتابعة غير موجودة في قاعدة البيانات.";
                } else if (error.message === "NOT_ADMIN") {
                    message =
                        "هذا الحساب لا يملك صلاحية الإدارة.";
                } else {
                    message = getFirebaseErrorMessage(error);
                }

                showAlert(message);

            } finally {
                adminLoginButton.disabled = false;
                adminLoading.style.display = "none";
            }
        });

    </script>
