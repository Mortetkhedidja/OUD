<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>التحقق من البطاقة — عضد</title>

    <style>

        body {

            margin: 0;

            padding: 30px;

            background: #f3f5f4;

            font-family: Arial, sans-serif;

            color: #1d2d2b;

        }


        .container {

            max-width: 600px;

            margin: 70px auto;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.10);

            text-align: center;

        }


        .logo {

            font-size: 38px;

            font-weight: bold;

            color: #123c38;

        }


        .title {

            color: #c6a15b;

            margin-top: 5px;

            font-size: 18px;

        }


        .valid {

            margin-top: 30px;

            padding: 20px;

            background: #edf8f1;

            border-radius: 12px;

            color: #277a50;

        }


        .valid h2 {

            margin-top: 0;

        }


        .info {

            margin-top: 25px;

            text-align: right;

            line-height: 2;

        }


        .info div {

            padding: 10px;

            border-bottom: 1px solid #eee;

        }


        .info strong {

            color: #123c38;

        }


        .invalid {

            margin-top: 30px;

            padding: 20px;

            background: #fff0f0;

            border-radius: 12px;

            color: #b42318;

        }


        .loading {

            padding: 30px;

        }

    </style>

</head>


<body>


<div
    id="container"
    class="container"
>

    <div class="logo">
        عُضد
    </div>

    <div class="title">
        نظام التحقق من بطاقة المتطوع
    </div>


    <div id="result">

        <div class="loading">
            جاري التحقق من البطاقة...
        </div>

    </div>

</div>


<script type="module">


    import {
        db
    } from "../js/firebase.js";


    import {
        doc,
        getDoc
    } from
    "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    const result =
        document.getElementById(
            "result"
        );


    /* --------------------------------
       الحصول على رقم البطاقة
    -------------------------------- */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const cardNumber =
        params.get("card");


    if (!cardNumber) {

        showInvalid(
            "لم يتم العثور على رقم البطاقة."
        );

    }
    else {

        verifyCard();

    }


    /* --------------------------------
       التحقق من البطاقة
    -------------------------------- */

    async function verifyCard() {

        try {

            /*
                نقرأ فقط من المجموعة العامة.
                لا نقرأ users ولا volunteerCards.
            */

            const cardRef =
                doc(
                    db,
                    "publicCardVerifications",
                    cardNumber
                );


            const cardSnapshot =
                await getDoc(cardRef);


            if (!cardSnapshot.exists()) {

                showInvalid(
                    "لم يتم العثور على بطاقة بهذا الرقم."
                );

                return;

            }


            const card =
                cardSnapshot.data();


            if (
                card.status !== "active"
            ) {

                showInvalid(
                    "هذه البطاقة غير فعالة."
                );

                return;

            }


            /* --------------------------------
               تاريخ الإصدار
            -------------------------------- */

            let issueDate =
                "غير متوفر";


            if (card.issueDate) {

                issueDate =
                    card.issueDate
                        .toDate()
                        .toLocaleDateString(
                            "fr-FR"
                        );

            }


            /* --------------------------------
               عرض البطاقة
            -------------------------------- */

            result.innerHTML = `

                <div class="valid">

                    <h2>
                        ✓ بطاقة صالحة
                    </h2>

                    <p>
                        هذه البطاقة معتمدة
                        وفعالة على منصة عُضد.
                    </p>

                </div>


                <div class="info">

                    <div>

                        <strong>
                            الاسم:
                        </strong>

                        ${escapeHtml(
                            card.fullName || ""
                        )}

                    </div>


                    <div>

                        <strong>
                            الرتبة:
                        </strong>

                        ${escapeHtml(
                            card.rank || "مبتدئ"
                        )}

                    </div>


                    <div>

                        <strong>
                            رقم البطاقة:
                        </strong>

                        ${escapeHtml(
                            card.cardNumber
                        )}

                    </div>


                    <div>

                        <strong>
                            تاريخ الإصدار:
                        </strong>

                        ${issueDate}

                    </div>

                </div>

            `;

        }

        catch (error) {

            console.error(
                "Verification error:",
                error
            );


            result.innerHTML = `

                <div class="invalid">

                    <h2>
                        تعذر التحقق
                    </h2>

                    <p>
                        حدث خطأ أثناء الاتصال
                        بنظام التحقق.
                    </p>

                </div>

            `;

        }

    }


    function showInvalid(message) {

        result.innerHTML = `

            <div class="invalid">

                <h2>
                    ✕ بطاقة غير صالحة
                </h2>

                <p>
                    ${message}
                </p>

            </div>

        `;

    }


    function escapeHtml(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }

</script>


</body>

</html>
